# 每次有新的晨報 HTML 放進 briefs/ 就自動：
#   1. 轉成圖片  2. 部署到 GitHub Pages  3. 推一則「點此分享」給你自己
name: Daily brief

on:
  push:
    branches: [main]
    paths: ['briefs/*.html']
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（留空 = 最新一份）'
        required: false
      notify:
        description: '完成後推播提醒到我的 LINE'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      LIFF_ID: ${{ vars.LIFF_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://ymt3232111-pixel.github.io/line-morning-brief' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝套件
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: 晨報轉圖片
        id: render
        run: node scripts/render.mjs ${{ inputs.date }}

      - name: 存回 repo（保留每天的圖）
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "brief: ${{ steps.render.outputs.date }}"
          git pull --rebase -X theirs --autostash
          git push

      # 過渡期：電腦上傳程式改指向私人 repo 之前，這裡也發布到 gh-pages
      - name: 發布網頁到公開 repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          user_name: brief-bot
          user_email: brief-bot@users.noreply.github.com

      - name: 推播提醒到我的 LINE
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-notify]')) || inputs.notify }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          BRIEF_DATE: ${{ steps.render.outputs.date }}
        run: node scripts/notify.mjs
