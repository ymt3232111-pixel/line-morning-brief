<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>分享晨報</title>
  <style>
    :root {
      --green: #06c755;
      --green-dark: #05a548;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d1f23;
      --muted: #7a7f88;
      --line: #e3e5e9;
      --err: #d93025;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(130px + env(safe-area-inset-bottom)); }
    .sec { font-size: 13px; color: var(--muted); margin: 18px 2px 8px; }
    .sec:first-child { margin-top: 4px; }
    .placeholder { color: var(--muted); font-size: 14px; padding: 40px 16px; text-align: center; background: var(--card); border-radius: 14px; }
    textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; font: inherit; font-size: 15px; background: var(--card); color: var(--text); }
    .opt { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px; font-size: 14px; margin-top: 10px; }
    .opt input { width: 20px; height: 20px; accent-color: var(--green); }
    .opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(244,245,247,.96);
      border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .bar-inner { max-width: 520px; margin: 0 auto; }
    .send-btn { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 17px; font-weight: 600;
      background: var(--green); color: #fff; cursor: pointer; }
    .send-btn:active { background: var(--green-dark); }
    .send-btn:disabled { background: #b9c0c8; }
    #status { min-height: 20px; font-size: 13px; text-align: center; margin-top: 8px; color: var(--muted); }
    #status.ok { color: var(--green-dark); }
    #status.err { color: var(--err); }

    /* ---- Flex 卡片預覽（盡量接近 LINE 實際樣子）---- */
    .fx-bubble { max-width: 300px; margin: 0 auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .fx-box { display: flex; min-width: 0; }
    .fx-v { flex-direction: column; }
    .fx-h { flex-direction: row; }
    .fx-text { min-width: 0; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fx-text.wrap { white-space: pre-wrap; overflow: visible; }
    .fx-sep { border-top: 1px solid #dfe4ea; }
    .fx-btn { border: 0; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 8px; min-width: 0; }
    .fx-img { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="sec">群組會收到這張卡片</div>
    <div id="preview"><div class="placeholder">載入中…</div></div>

    <div class="sec">附帶的文字（可修改，清空就不傳文字）</div>
    <textarea id="msg">各位早安，今日晨報供參考 🙏</textarea>

    <label class="opt">
      <input type="checkbox" id="withImages" />
      <span>同時附上完整長圖<small id="imgInfo">表格截圖，對方可以存到手機</small></span>
    </label>
  </main>

  <div class="bar">
    <div class="bar-inner">
      <button class="send-btn" id="share" disabled>選擇群組並分享</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module">
    import { buildCard } from '../card.js';

    // 網站根目錄：https://帳號.github.io/repo（不管 LIFF Endpoint 結尾有沒有斜線都算得對）
    const BASE = location.origin + location.pathname.replace(/\/liff(\/.*)?$/, '');
    const $ = (id) => document.getElementById(id);
    let brief = null;
    let card = null;
    let config = null;

    function setStatus(text, kind) {
      $('status').textContent = text || '';
      $('status').className = kind || '';
    }

    async function getJSON(rel) {
      const res = await fetch(`${BASE}/${rel}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`讀不到 ${rel}（${res.status}）`);
      return res.json();
    }

    // ---- 把 Flex JSON 畫成 HTML 預覽 ----
    const SIZE = { xxs: 11, xs: 13, sm: 14, md: 16, lg: 19, xl: 22 };
    const GAP = { none: 0, xs: 2, sm: 4, md: 8, lg: 12, xl: 16, xxl: 20 };
    function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
    function applyFlex(e, n, parentHorizontal) {
      if (n.flex !== undefined) e.style.flex = n.flex === 0 ? '0 0 auto' : `${n.flex} 1 0`;
      else if (parentHorizontal) e.style.flex = '1 1 0';
      if (n.margin) e.style.marginTop = (GAP[n.margin] ?? parseInt(n.margin)) + 'px';
    }
    function draw(n, parentHorizontal) {
      if (n.type === 'box') {
        const e = el('div', `fx-box ${n.layout === 'horizontal' ? 'fx-h' : 'fx-v'}`);
        if (n.backgroundColor) e.style.background = n.backgroundColor;
        if (n.cornerRadius) e.style.borderRadius = n.cornerRadius;
        if (n.paddingAll) e.style.padding = n.paddingAll;
        for (const k of ['Top', 'Bottom', 'Start', 'End']) {
          const v = n['padding' + k];
          if (v) e.style['padding' + ({ Start: 'Left', End: 'Right' }[k] || k)] = v;
        }
        if (n.alignItems) e.style.alignItems = n.alignItems;
        const gap = GAP[n.spacing] || 0;
        n.contents.forEach((c, i) => {
          const ce = draw(c, n.layout === 'horizontal');
          if (i > 0 && gap && !c.margin) ce.style[n.layout === 'horizontal' ? 'marginLeft' : 'marginTop'] = gap + 'px';
          if (i > 0 && c.margin && n.layout === 'horizontal') { ce.style.marginTop = ''; ce.style.marginLeft = (GAP[c.margin] || 0) + 'px'; }
          e.appendChild(ce);
        });
        applyFlex(e, n, parentHorizontal);
        return e;
      }
      if (n.type === 'text') {
        const e = el('div', 'fx-text' + (n.wrap ? ' wrap' : ''));
        e.textContent = n.text;
        e.style.fontSize = (SIZE[n.size] || 14) + 'px';
        if (n.color) e.style.color = n.color;
        if (n.weight === 'bold') e.style.fontWeight = '700';
        if (n.align) e.style.textAlign = n.align === 'end' ? 'right' : n.align;
        applyFlex(e, n, parentHorizontal);
        return e;
      }
      if (n.type === 'separator') {
        const e = el('div', 'fx-sep');
        applyFlex(e, n, false);
        return e;
      }
      if (n.type === 'image') {
        const e = el('img', 'fx-img');
        e.src = n.url;
        e.style.width = /px$/.test(n.size) ? n.size : '100%';
        applyFlex(e, n, parentHorizontal);
        return e;
      }
      if (n.type === 'button') {
        const e = el('button', 'fx-btn');
        e.type = 'button';
        e.textContent = n.action.label;
        const primary = n.style === 'primary';
        const link = n.style === 'link';
        e.style.background = primary ? (n.color || '#06c755') : link ? 'transparent' : '#eef0f3';
        e.style.color = primary ? '#fff' : link ? (n.color || '#06c755') : '#1d1f23';
        e.onclick = () => window.open(n.action.uri, '_blank');
        applyFlex(e, n, parentHorizontal);
        return e;
      }
      return el('div');
    }
    function renderPreview(flex) {
      const b = flex.contents;
      const wrap = el('div', 'fx-bubble');
      for (const part of ['header', 'body', 'footer']) {
        if (!b[part]) continue;
        const e = draw(b[part]);
        if (part === 'footer' && b.styles?.footer?.separator) e.style.borderTop = '1px solid #dfe4ea';
        if (b[part].action) { e.style.cursor = 'pointer'; e.onclick = () => window.open(b[part].action.uri, '_blank'); }
        wrap.appendChild(e);
      }
      $('preview').innerHTML = '';
      $('preview').appendChild(wrap);
    }

    async function start() {
      try {
        config = await getJSON('config.json');
        await liff.init({ liffId: config.liffId });

        // 在 LINE 外面（例如電腦瀏覽器）打開時，需要先登入
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        // LIFF 初始化後，?date= 參數才會還原到網址上
        const date = new URLSearchParams(location.search).get('date');
        brief = date && /^\d{4}-\d{2}-\d{2}$/.test(date)
          ? await getJSON(`brief/${date}.json`)
          : await getJSON('latest.json');

        brief.images = brief.images && brief.images.length
          ? brief.images
          : [{ label: '', image: brief.image, preview: brief.preview }];
        $('imgInfo').textContent = `${brief.images.map((i) => i.label || '晨報').join('、')}，共 ${brief.images.length} 張，對方可以存到手機`;

        // 卡片上放「轉傳給其他人」：收到的人點了會打開這個分享頁，也能分享到他自己的群組
        card = buildCard(brief, BASE, { forwardUrl: `https://liff.line.me/${config.liffId}?date=${brief.date}` });
        renderPreview(card);

        if (brief.withdrawn) {
          $('preview').innerHTML = '<div class="placeholder">這份晨報已撤回，無法再分享。</div>';
          setStatus('這份晨報已撤回', 'err');
          return;
        }

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('這個環境不能分享：請在 LINE App 裡開啟，並確認後台已開啟 shareTargetPicker', 'err');
          return;
        }
        $('share').disabled = false;
      } catch (err) {
        console.error(err);
        $('preview').innerHTML = '';
        setStatus('載入失敗：' + (err.message || err), 'err');
      }
    }

    $('share').addEventListener('click', async () => {
      if (!brief || !card) return;
      const messages = [];
      const text = $('msg').value.trim();
      if (text) messages.push({ type: 'text', text });
      messages.push(card);
      if ($('withImages').checked) {
        // LINE 一次最多 5 則訊息
        brief.images.slice(0, 5 - messages.length).forEach((it) => {
          messages.push({
            type: 'image',
            originalContentUrl: `${BASE}/${it.image}`,
            previewImageUrl: `${BASE}/${it.preview}`,
          });
        });
      }

      $('share').disabled = true;
      setStatus('');
      try {
        const res = await liff.shareTargetPicker(messages, { isMultiple: true });
        setStatus(res ? '✅ 已分享' : '已取消，沒有送出', res ? 'ok' : '');
      } catch (err) {
        console.error(err);
        setStatus('分享失敗：' + (err.message || err.code || err), 'err');
      } finally {
        $('share').disabled = false;
      }
    });

    start();
  </script>
</body>
</html>
