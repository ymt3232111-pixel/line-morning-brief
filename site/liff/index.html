<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>分享晨報</title>
  <style>
    :root {
      --green: #06c755;
      --green-dark: #05a548;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d1f23;
      --muted: #7a7f88;
      --line: #e3e5e9;
      --err: #d93025;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
    header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 12px; }
    h1 { font-size: 19px; margin: 0; }
    .date { font-size: 13px; color: var(--muted); }
    .shot { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-height: 240px;
      display: flex; align-items: center; justify-content: center; }
    .shot img { width: 100%; display: block; }
    .shot.stack { display: block; }
    .shot .cap { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px 6px; background: var(--bg); }
    .shot .cap:first-child { background: var(--card); }
    #count { color: var(--green-dark); font-weight: 600; margin-left: 4px; }
    .shot .placeholder { color: var(--muted); font-size: 14px; padding: 40px 16px; text-align: center; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 18px 2px 6px; }
    textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; font: inherit; font-size: 15px; background: var(--card); color: var(--text); }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(244,245,247,.96);
      border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .bar-inner { max-width: 520px; margin: 0 auto; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 17px; font-weight: 600;
      background: var(--green); color: #fff; cursor: pointer; }
    button:active { background: var(--green-dark); }
    button:disabled { background: #b9c0c8; }
    #status { min-height: 20px; font-size: 13px; text-align: center; margin-top: 8px; color: var(--muted); }
    #status.ok { color: var(--green-dark); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">每日晨報</h1>
      <span class="date" id="date"></span>
    </header>

    <div class="shot" id="shot"><div class="placeholder">載入中…</div></div>

    <label for="msg">附帶的文字（可修改，清空就只傳圖片）</label>
    <textarea id="msg">各位早安，今日晨報供參考 🙏</textarea>
    <p class="hint">按下方按鈕後，可以一次勾選多個群組或好友。<span id="count"></span></p>
  </main>

  <div class="bar">
    <div class="bar-inner">
      <button id="share" disabled>選擇群組並分享</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 網站根目錄：https://帳號.github.io/repo（不管 LIFF Endpoint 結尾有沒有斜線都算得對）
    const BASE = location.origin + location.pathname.replace(/\/liff(\/.*)?$/, '');
    const $ = (id) => document.getElementById(id);
    let brief = null;

    function setStatus(text, kind) {
      const el = $('status');
      el.textContent = text || '';
      el.className = kind || '';
    }

    async function getJSON(rel) {
      const res = await fetch(`${BASE}/${rel}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`讀不到 ${rel}（${res.status}）`);
      return res.json();
    }

    async function start() {
      try {
        const config = await getJSON('config.json');
        await liff.init({ liffId: config.liffId });

        // 在 LINE 外面（例如電腦瀏覽器）打開時，需要先登入
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        // LIFF 初始化後，?date= 參數才會還原到網址上
        const date = new URLSearchParams(location.search).get('date');
        brief = date && /^\d{4}-\d{2}-\d{2}$/.test(date)
          ? await getJSON(`brief/${date}.json`)
          : await getJSON('latest.json');

        $('title').textContent = brief.title;
        $('date').textContent = brief.date;
        // 新版有 images（每個分頁一張），舊版只有 image
        brief.images = brief.images && brief.images.length
          ? brief.images
          : [{ label: '', image: brief.image, preview: brief.preview }];

        $('shot').innerHTML = '';
        $('shot').classList.add('stack');
        brief.images.forEach((it, i) => {
          if (brief.images.length > 1) {
            const cap = document.createElement('div');
            cap.className = 'cap';
            cap.textContent = `圖 ${i + 1}／${brief.images.length}${it.label ? '・' + it.label : ''}`;
            $('shot').appendChild(cap);
          }
          const img = new Image();
          img.alt = it.label || brief.title;
          img.loading = i === 0 ? 'eager' : 'lazy';
          img.src = `${BASE}/${it.preview}`;
          img.onerror = () => {
            $('shot').innerHTML = '<div class="placeholder">圖片還沒上線，請過一兩分鐘再開一次</div>';
          };
          $('shot').appendChild(img);
        });
        $('count').textContent = brief.images.length > 1 ? `會送出 ${brief.images.length} 張圖` : '';

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('這個環境不能分享：請在 LINE App 裡開啟，並確認後台已開啟 shareTargetPicker', 'err');
          return;
        }
        $('share').disabled = false;
      } catch (err) {
        console.error(err);
        setStatus('載入失敗：' + (err.message || err), 'err');
      }
    }

    $('share').addEventListener('click', async () => {
      if (!brief) return;
      const messages = [];
      const text = $('msg').value.trim();
      if (text) messages.push({ type: 'text', text });
      // LINE 一次最多 5 則訊息
      brief.images.slice(0, text ? 4 : 5).forEach((it) => {
        messages.push({
          type: 'image',
          originalContentUrl: `${BASE}/${it.image}`,
          previewImageUrl: `${BASE}/${it.preview}`,
        });
      });

      $('share').disabled = true;
      setStatus('');
      try {
        const res = await liff.shareTargetPicker(messages, { isMultiple: true });
        if (res) {
          setStatus('✅ 已分享', 'ok');
        } else {
          setStatus('已取消，沒有送出');
        }
      } catch (err) {
        console.error(err);
        setStatus('分享失敗：' + (err.message || err.code || err), 'err');
      } finally {
        $('share').disabled = false;
      }
    });

    start();
  </script>
</body>
</html>
