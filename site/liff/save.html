<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>儲存晨報圖片</title>
  <style>
    body { margin: 0; background: #f4f5f7; color: #1d1f23;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 4px 0 6px; }
    .tip { font-size: 14px; color: #05a548; background: #e8f8ee; border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; line-height: 1.6; }
    figure { margin: 0 0 18px; }
    figcaption { font-size: 13px; color: #7a7f88; margin: 0 2px 6px; }
    img { width: 100%; display: block; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); background: #fff; }
    a.dl { display: inline-block; margin-top: 8px; font-size: 14px; color: #05a548; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">晨報圖片</h1>
    <p class="tip">長按圖片 →「加入照片」或「下載圖片」，存好後回 LINE 從相簿一次選多張傳送，就會並排成一包。</p>
    <div id="list">載入中…</div>
  </main>
  <script>
    const BASE = location.origin + location.pathname.replace(/\/liff(\/.*)?$/, '');
    (async () => {
      const date = new URLSearchParams(location.search).get('date');
      const rel = date && /^\d{4}-\d{2}-\d{2}$/.test(date) ? `brief/${date}.json` : 'latest.json';
      try {
        const res = await fetch(`${BASE}/${rel}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const b = await res.json();
        const list = b.shareImages && b.shareImages.length ? b.shareImages : b.images;
        document.getElementById('title').textContent = b.title || '晨報圖片';
        const box = document.getElementById('list');
        box.innerHTML = '';
        list.forEach((it, i) => {
          const f = document.createElement('figure');
          const c = document.createElement('figcaption');
          c.textContent = `圖 ${i + 1}／${list.length}${it.label ? '・' + it.label : ''}`;
          const img = new Image();
          img.src = `${BASE}/${it.image}`;
          img.alt = it.label || '晨報';
          const a = document.createElement('a');
          a.className = 'dl';
          a.href = img.src;
          a.download = `${b.date}_${i + 1}_${it.label || '晨報'}.${it.image.split('.').pop()}`;
          a.textContent = '下載這張';
          f.append(c, img, a);
          box.appendChild(f);
        });
      } catch (e) {
        document.getElementById('list').textContent = '讀不到圖片，請稍後再試。';
      }
    })();
  </script>
</body>
</html>
